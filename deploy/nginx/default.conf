server {
    listen 80;
    server_name churchsys.cmals.org;

    # Let's Encrypt renewal (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name churchsys.cmals.org;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location /css { try_files $uri =404; }
    location /js  { try_files $uri =404; }
    location /images { try_files $uri =404; }
    location /icons { try_files $uri =404; }
    location /storage/file {
        alias /var/www/html/public/storage/file;
        try_files $uri =404;
    }

    # PWA: service worker must always be revalidated
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA: web app manifest
    location = /manifest.json {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
