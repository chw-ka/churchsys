services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: churchsys-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /mnt/s3-drive/churchsys/file:/var/www/html/public/storage/file:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=churchsys
      - DB_USERNAME=churchsys
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - churchsys-net

  web:
    image: nginx:alpine
    container_name: churchsys-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - churchsys-net

  mysql:
    image: mysql:8.0
    container_name: churchsys-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: churchsys
      MYSQL_USER: churchsys
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - churchsys-net

volumes:
  mysql_data:

networks:
  churchsys-net:
    driver: bridge
